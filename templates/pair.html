<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander Pairing</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07090d; --plate:#11151d; --edge:#2a3242; --text:#eef2f7; --muted:#7f8a9c; --amber:#ffb21a; --cyan:#3fd0ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background: radial-gradient(120% 60% at 50% -10%, rgba(255,178,26,.14), transparent 60%), var(--bg);
         color:var(--text); font:16px/1.4 Oxanium, system-ui, sans-serif; }
  .panel { width:min(460px, 100%); background:linear-gradient(160deg, #171c26, var(--plate)); padding:24px;
           clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
           display:grid; gap:16px; text-align:center; }
  small { font: 12px 'Share Tech Mono', monospace; color: var(--amber); letter-spacing: .3em; }
  h1 { margin:0; font-size:24px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-style:italic; }
  h1 span { color: var(--amber); }
  .qr { background:#fff; padding:12px; justify-self:center; width:min(300px, 100%); }
  .qr svg { display:block; width:100%; height:auto; }
  .link { display:flex; gap:8px; }
  .link input { flex:1; min-width:0; border:0; padding:12px; background:#0b0f15; color:var(--cyan);
                font: 14px 'Share Tech Mono', monospace; box-shadow: inset 0 0 0 1px var(--edge); }
  button { border:0; padding:12px 16px; font:600 14px Oxanium, sans-serif; text-transform:uppercase; letter-spacing:.08em;
           background:linear-gradient(180deg, #ffc546, var(--amber)); color:#1a1100; cursor:pointer; }
  p { margin:0; color:var(--muted); font-size:14px; }
  a { color: var(--cyan); word-break: break-all; }
</style>
</head>
<body>
  <main class="panel">
    <div><small>TACTICAL LINK</small><h1>Pair <span>your phone</span></h1></div>
    <div class="qr">{{ qr_svg }}</div>
    <div class="link">
      <input id="u" value="{{ url }}" readonly aria-label="Phone remote link">
      <button id="copy" type="button">Copy</button>
    </div>
    <p>Scan the QR code, or open <a href="{{ url }}">{{ url }}</a> on your phone (same Wi-Fi).<br>
       The part after <b>#</b> is your secret topic, so don't share it.</p>
  </main>
<script>
  document.getElementById('copy').addEventListener('click', async () => {
    const u = document.getElementById('u'), b = document.getElementById('copy');
    try { await navigator.clipboard.writeText(u.value); } catch (_) { u.select(); document.execCommand('copy'); }
    b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500);
  });
</script>
</body>
</html>
